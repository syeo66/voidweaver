name: voidweaver_player
description: Gapless playlist player on Media3 ExoPlayer with a gain stage per item.
version: 0.1.0
publish_to: none

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: red.ochsenbein.voidweaver.player
        pluginClass: VoidweaverPlayerPlugin
