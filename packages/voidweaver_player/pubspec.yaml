name: voidweaver_player
description: Gapless playlist player on Media3 ExoPlayer with a gain stage per item.
version: 0.1.0
publish_to: none

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: com.example.voidweaver.player
        pluginClass: VoidweaverPlayerPlugin
