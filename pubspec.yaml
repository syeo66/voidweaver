name: voidweaver
description: A Flutter audioplayer app connecting to Subsonic API with advanced caching
version: 1.1.0+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  http_plus: ^0.2.3
  just_audio: ^0.10.6
  crypto: ^3.0.7
  xml: ^7.1.0
  shared_preferences: ^2.5.6
  flutter_secure_storage: ^11.2.0
  provider: ^6.1.5+1
  cached_network_image: ^4.0.4
  audio_service: ^0.18.19
  path_provider: ^2.1.6
  share_plus: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: "^0.14.4"
  mockito: ^5.8.1
  build_runner: ^2.16.2

flutter:
  uses-material-design: true
  assets:
    - assets/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
  web:
    generate: false
    image_path: "path/to/image.png"
    background_color: "#hexcode"
    theme_color: "#hexcode"
  windows:
    generate: false
    image_path: "path/to/image.png"
    icon_size: 48 # min:48, max:256, default: 48
  macos:
    generate: false
    image_path: "path/to/image.png"
