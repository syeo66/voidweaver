name: voidweaver
description: Android music player for a Subsonic server (Navidrome behind subsoxy) that plays whole albums and random songs
publish_to: none
version: 1.1.10+2

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  voidweaver_player:
    path: packages/voidweaver_player
  crypto: ^3.0.8
  xml: ^7.1.0
  shared_preferences: ^2.5.6
  flutter_secure_storage: ^11.2.0
  logging: ^1.3.0
  provider: ^6.1.5+1
  cached_network_image: ^4.0.6
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  package_info_plus: ^10.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: "^0.14.4"
  fake_async: ^1.3.3
  flutter_secure_storage_platform_interface: ^2.1.1
  mockito: ^5.8.1
  build_runner: ^2.16.2
  shared_preferences_platform_interface: ^2.4.2

flutter:
  uses-material-design: true
  assets:
    - assets/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/icon/icon.png"
  min_sdk_android: 24 # the app's minSdk (Flutter's default, and the player plugin's)
