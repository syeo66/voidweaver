name: Flutter CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v7
    
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.47.7'
        channel: 'stable'

    - name: Install dependencies
      run: flutter pub get

    - name: Verify formatting
      run: dart format --output=none --set-exit-if-changed .
    
    - name: Analyze project source
      run: flutter analyze
    
    - name: Run tests
      run: flutter test --coverage

    - name: Run player plugin tests
      working-directory: packages/voidweaver_player
      run: flutter test
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v7
      with:
        files: coverage/lcov.info
        fail_ci_if_error: false

  build-android:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - uses: actions/checkout@v7
      with:
        # Full history: the build number is the commit count
        fetch-depth: 0
    
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.47.7'
        channel: 'stable'

    - name: Install dependencies
      run: flutter pub get

    - name: Build Android APK
      run: flutter build apk --release

    # After the build, which generates the Gradle wrapper
    - name: Run player plugin JVM tests
      working-directory: android
      run: ./gradlew :voidweaver_player:testDebugUnitTest
    
    - name: Upload APK artifact
      uses: actions/upload-artifact@v7
      with:
        name: android-apk
        path: build/app/outputs/flutter-apk/app-release.apk

  integration-test:
    runs-on: ubuntu-latest
    needs: test

    steps:
    - uses: actions/checkout@v7

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.47.7'
        channel: 'stable'

    - name: Install dependencies
      run: flutter pub get

    # Hardware acceleration for the emulator
    - name: Enable KVM
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    # User flows against the fake Subsonic server, with the real player
    - name: Run integration tests in an emulator
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 35
        arch: x86_64
        target: google_apis
        disable-animations: true
        script: flutter test integration_test
