name: Flutter CI/CD

# Actions are pinned to commit SHAs, as a tag can be moved to other code (the
# build job has the signing secrets). Dependabot updates them, see
# .github/dependabot.yml.
on:
  push:
    branches: [ main ]
    # A version tag publishes a GitHub release, see docs/RELEASING.md
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

# Every job gets read access only; the release job asks for more
permissions:
  contents: read

jobs:
  test:
    # tool/release.sh pushes main and the tag together; the tag's run checks
    # the release commit, so the branch's run of it would only repeat that.
    # The jobs that need this one are skipped with it.
    if: github.ref_type == 'tag' || !startsWith(github.event.head_commit.message, 'release v')
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    
    - name: Setup Flutter
      uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
      with:
        flutter-version: '3.47.7'
        channel: 'stable'
        # The SDK and the pub cache
        cache: true

    - name: Install dependencies
      run: flutter pub get

    - name: Verify formatting
      run: dart format --output=none --set-exit-if-changed .
    
    - name: Analyze project source
      run: flutter analyze
    
    - name: Run tests
      run: flutter test --coverage

    - name: Run player plugin tests
      working-directory: packages/voidweaver_player
      run: flutter test
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
      with:
        files: coverage/lcov.info
        fail_ci_if_error: false

  build-android:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        # Full history: the build number is the commit count
        fetch-depth: 0
    
    - name: Setup Flutter
      uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
      with:
        flutter-version: '3.47.7'
        channel: 'stable'
        # The SDK and the pub cache
        cache: true

    # Gradle User Home (wrapper, dependencies). The basic provider: the
    # default one is proprietary.
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
      with:
        cache-provider: basic

    - name: Install dependencies
      run: flutter pub get

    # The release key, if the repository has it. Without it (forks, or not set
    # up yet) the APK is signed with the debug key, which the release job
    # rejects.
    - name: Decode release keystore
      env:
        KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      run: |
        if [ -n "$KEYSTORE_BASE64" ]; then
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "VOIDWEAVER_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
        fi

    - name: Build Android APK
      env:
        VOIDWEAVER_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        VOIDWEAVER_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        VOIDWEAVER_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
      run: flutter build apk --release

    # Notification resources, media session manifest entries and classes,
    # which R8 and the resource shrinker can remove without any test failing
    - name: Check the release APK
      run: tool/check_release_apk.sh

    # After the build, which generates the Gradle wrapper
    - name: Run player plugin JVM tests
      working-directory: android
      run: ./gradlew :voidweaver_player:testDebugUnitTest
    
    - name: Upload APK artifact
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: android-apk
        path: build/app/outputs/flutter-apk/app-release.apk

  integration-test:
    runs-on: ubuntu-latest
    needs: test

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Setup Flutter
      uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
      with:
        flutter-version: '3.47.7'
        channel: 'stable'
        # The SDK and the pub cache
        cache: true

    # Gradle User Home (wrapper, dependencies). The basic provider: the
    # default one is proprietary.
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
      with:
        cache-provider: basic

    - name: Install dependencies
      run: flutter pub get

    # Hardware acceleration for the emulator
    - name: Enable KVM
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    # User flows against the fake Subsonic server, with the real player
    # (debug build). The release-build checks (tool/emulator_check.sh) run
    # locally only: in the runner's emulator they failed at the login step.
    - name: Run integration tests in an emulator
      uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
      with:
        api-level: 35
        arch: x86_64
        target: google_apis
        profile: pixel_6
        disable-animations: true
        script: flutter test integration_test

  # Publishes the APK as a GitHub release when a version tag is pushed
  # (git tag v1.2.0 && git push origin v1.2.0). Only after everything else
  # passed.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [test, build-android, integration-test]
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Download the APK
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
      with:
        name: android-apk

    # The tag must be the version in pubspec.yaml, or the release would
    # announce one version and ship another
    - name: Check the tag against pubspec.yaml
      run: |
        version=$(sed -n 's/^version: *\([^+ ]*\).*/\1/p' pubspec.yaml)
        if [ "$GITHUB_REF_NAME" != "v$version" ]; then
          echo "Tag $GITHUB_REF_NAME doesn't match pubspec.yaml's version $version" >&2
          exit 1
        fi
        echo "VERSION=$version" >> "$GITHUB_ENV"

    # A debug-signed APK can't update an installed release
    - name: Check the signature
      run: tool/check_apk_signature.sh app-release.apk

    - name: Create the release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        mv app-release.apk "voidweaver-v$VERSION.apk"
        sha256sum "voidweaver-v$VERSION.apk" > "voidweaver-v$VERSION.apk.sha256"
        # 1.2.0-beta.1 is a prerelease
        case "$VERSION" in *-*) pre=--prerelease ;; *) pre= ;; esac
        gh release create "$GITHUB_REF_NAME" $pre --verify-tag --generate-notes \
          --title "Voidweaver $VERSION" \
          "voidweaver-v$VERSION.apk" "voidweaver-v$VERSION.apk.sha256"
